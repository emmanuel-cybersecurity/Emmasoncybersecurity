<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071A33">

    <meta name="description"
          content="EMMASON CYBER SECURITY provides cybersecurity awareness, security consulting, network security education, and digital protection guidance. Smart Protection for a Connected World.">

    <meta name="keywords"
          content="EMMASON Cyber Security, cybersecurity, network security, digital protection, security awareness, ethical hacking">

    <meta name="author" content="EMMASON CYBER SECURITY">

    <title>EMMASON CYBER SECURITY | Smart Protection for a Connected World</title>

    <link rel="icon" type="image/png" href="2026LOGO.png">

    <style>
        /* =========================
           1. GLOBAL STYLES
        ========================== */

        :root {
            --navy: #071A33;
            --navy-light: #102747;
            --blue: #1677FF;
            --cyan: #00D4FF;
            --white: #FFFFFF;
            --light: #F3F7FC;
            --gray: #64748B;
            --dark: #122033;
            --border: #DCE5F0;
            --success: #13B981;
            --shadow: 0 12px 35px rgba(7, 26, 51, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
            color: var(--dark);
            background: var(--white);
        }

        img {
            max-width: 100%;
        }

        a {
            text-decoration: none;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: min(1120px, 92%);
            margin: 0 auto;
        }

        .section {
            padding: 85px 0;
        }

        .section-title {
            max-width: 720px;
            margin: 0 auto 45px;
            text-align: center;
        }

        .section-title .eyebrow {
            color: var(--blue);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .section-title h2 {
            color: var(--navy);
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            line-height: 1.25;
            margin: 12px 0;
        }

        .section-title p {
            color: var(--gray);
            font-size: 1rem;
        }

        /* =========================
           2. HEADER AND LOGO
        ========================== */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--navy);
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
        }

        .header-inner {
            min-height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        /* Actual company logo image */
        .logo {
            display: block;
            width: 65px;
            height: 65px;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 8px;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text h1 {
            color: var(--white);
            font-size: clamp(0.9rem, 2.4vw, 1.25rem);
            line-height: 1.3;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .brand-text p {
            color: var(--cyan);
            font-size: 0.72rem;
            line-height: 1.5;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 22px;
            list-style: none;
        }

        .nav-menu a {
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-menu a:hover,
        .nav-menu a:focus-visible {
            color: var(--cyan);
        }

        .nav-menu .nav-contact {
            background: var(--blue);
            padding: 10px 17px;
            border-radius: 7px;
        }

        .nav-menu .nav-contact:hover {
            color: var(--white);
            background: #0865E8;
        }

        .menu-toggle {
            display: none;
            background: transparent;
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 1rem;
            cursor: pointer;
        }

        /* =========================
           3. HERO SECTION
        ========================== */

        .hero {
            position: relative;
            overflow: hidden;
            color: var(--white);
            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(22, 119, 255, 0.28),
                    transparent 35%
                ),
                linear-gradient(135deg, #071A33, #102B50);
            padding: 105px 0 100px;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 330px;
            height: 330px;
            border: 1px solid rgba(0, 212, 255, 0.16);
            border-radius: 50%;
            right: -110px;
            bottom: -150px;
            pointer-events: none;
        }

        .hero-grid {
            position: relative;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 55px;
        }

        .hero-badge {
            display: inline-block;
            color: var(--cyan);
            background: rgba(0, 212, 255, 0.09);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 50px;
            padding: 7px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 23px;
        }

        .hero h2 {
            font-size: clamp(2.3rem, 5vw, 4rem);
            line-height: 1.13;
            margin-bottom: 22px;
            letter-spacing: -1.5px;
        }

        .hero h2 span {
            color: var(--cyan);
        }

        .hero-description {
            color: #D0DCEC;
            font-size: 1.05rem;
            max-width: 610px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 13px 21px;
            border-radius: 7px;
            font-weight: 700;
            font-size: 0.92rem;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            color: var(--white);
            background: var(--blue);
        }

        .btn-primary:hover {
            background: #0865E8;
        }

        .btn-outline {
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.55);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.08);
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 310px;
        }

        .hero-logo-frame {
            width: min(310px, 100%);
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 28px;
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 70px rgba(22,119,255,0.12);
        }

        .hero-logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* =========================
           4. TRUST STRIP
        ========================== */

        .trust-strip {
            background: var(--light);
            border-bottom: 1px solid var(--border);
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 25px 0;
        }

        .trust-item {
            text-align: center;
            color: var(--navy);
            font-weight: 700;
            font-size: 0.94rem;
        }

        .trust-item span {
            display: block;
            color: var(--gray);
            font-size: 0.82rem;
            font-weight: 400;
            margin-top: 3px;
        }

        /* =========================
           5. ABOUT SECTION
        ========================== */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 55px;
        }

        .about-content .eyebrow {
            color: var(--blue);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .about-content h2 {
            color: var(--navy);
            font-size: clamp(1.9rem, 4vw, 2.7rem);
            line-height: 1.25;
            margin: 12px 0 20px;
        }

        .about-content p {
            color: var(--gray);
            margin-bottom: 16px;
        }

        .about-points {
            display: grid;
            gap: 12px;
            margin-top: 23px;
        }

        .about-point {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: var(--dark);
            font-weight: 600;
        }

        .check {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #DDF8EC;
            color: #087F55;
            font-weight: 900;
        }

        .about-card {
            padding: 35px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--light);
        }

        .about-card h3 {
            color: var(--navy);
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .about-card p {
            color: var(--gray);
            margin-bottom: 20px;
        }

        .principle {
            padding: 15px 0;
            border-top: 1px solid var(--border);
        }

        .principle strong {
            display: block;
            color: var(--navy);
            margin-bottom: 4px;
        }

        .principle span {
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* =========================
           6. SERVICES
        ========================== */

        .services {
            background: var(--light);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .service-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 28px 24px;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .service-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            border-radius: 12px;
            background: #E6F1FF;
            color: var(--blue);
            font-size: 1.5rem;
            margin-bottom: 19px;
        }

        .service-card h3 {
            color: var(--navy);
            font-size: 1.15rem;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .service-card p {
            color: var(--gray);
            font-size: 0.93rem;
        }

        /* =========================
           7. WHY CHOOSE US
        ========================== */

        .why-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .why-card {
            display: flex;
            align-items: flex-start;
            gap: 17px;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .why-number {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            color: var(--blue);
            background: #E6F1FF;
            border-radius: 10px;
            font-weight: 800;
        }

        .why-card h3 {
            color: var(--navy);
            font-size: 1.05rem;
            margin-bottom: 7px;
        }

        .why-card p {
            color: var(--gray);
            font-size: 0.92rem;
        }

        /* =========================
           8. SECURITY AWARENESS
        ========================== */

        .awareness {
            background: var(--navy);
            color: var(--white);
        }

        .awareness-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 50px;
        }

        .awareness h2 {
            font-size: clamp(1.9rem, 4vw, 2.6rem);
            line-height: 1.25;
            margin-bottom: 18px;
        }

        .awareness h2 span {
            color: var(--cyan);
        }

        .awareness p {
            color: #CBD8E8;
            margin-bottom: 20px;
        }

        .awareness-list {
            display: grid;
            gap: 13px;
        }

        .awareness-list div {
            padding: 13px 16px;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: #E7F0FC;
        }

        /* =========================
           9. CONTACT SECTION
        ========================== */

        .contact {
            background: var(--light);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 35px;
        }

        .contact-info {
            padding: 30px;
            color: var(--white);
            background: var(--navy);
            border-radius: 15px;
        }

        .contact-info h3 {
            font-size: 1.5rem;
            margin-bottom: 13px;
        }

        .contact-info > p {
            color: #CBD8E8;
            margin-bottom: 25px;
        }

        .contact-detail {
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .contact-detail strong {
            display: block;
            color: var(--cyan);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .contact-detail a,
        .contact-detail span {
            color: var(--white);
            overflow-wrap: anywhere;
        }

        .contact-form {
            background: var(--white);
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .contact-form h3 {
            color: var(--navy);
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .contact-form > p {
            color: var(--gray);
            font-size: 0.92rem;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            color: var(--dark);
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            display: block;
            width: 100%;
            padding: 12px 13px;
            color: var(--dark);
            font: inherit;
            font-size: 0.93rem;
            border: 1px solid #CBD5E1;
            border-radius: 7px;
            background: var(--white);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: 2px solid rgba(22,119,255,0.25);
            border-color: var(--blue);
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-submit {
            width: 100%;
            border: none;
            cursor: pointer;
            font: inherit;
        }

        .form-note {
            margin-top: 12px;
            color: var(--gray);
            font-size: 0.78rem;
        }

        /* =========================
           10. SOCIAL LINKS
        ========================== */

        .social-section {
            padding: 55px 0;
            text-align: center;
        }

        .social-section h2 {
            color: var(--navy);
            font-size: 1.7rem;
            margin-bottom: 10px;
        }

        .social-section p {
            color: var(--gray);
            margin-bottom: 25px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 18px;
            color: var(--navy);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .social-links a:hover {
            color: var(--white);
            background: var(--blue);
            border-color: var(--blue);
        }

        /* =========================
           11. FOOTER
        ========================== */

        .site-footer {
            color: #CBD8E8;
            background: #041123;
            padding: 45px 0 20px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr 1fr;
            gap: 35px;
            padding-bottom: 30px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .footer-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .footer-brand h2 {
            color: var(--white);
            font-size: 1rem;
            line-height: 1.4;
        }

        .footer-brand p {
            color: var(--cyan);
            font-size: 0.75rem;
        }

        .footer-description {
            color: #AEBED1;
            font-size: 0.9rem;
        }

        .footer-column h3 {
            color: var(--white);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .footer-column ul {
            list-style: none;
        }

        .footer-column li {
            margin-bottom: 9px;
        }

        .footer-column a {
            color: #CBD8E8;
            font-size: 0.9rem;
        }

        .footer-column a:hover {
            color: var(--cyan);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px
